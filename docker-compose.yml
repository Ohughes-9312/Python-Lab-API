services:
  app:
    build: .
    container_name: python-lab
    volumes:
      - .:/app
    command: python3 -m uvicorn src.api:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    networks:
      - default
      - infrastructure

networks:
  infrastructure:
    external: true
    name: infrastructure_default